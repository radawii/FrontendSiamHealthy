<!DOCTYPE html>
<html lang="th">
<head>
    <title>Siam-Healthy - Shop</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="./css/shop.css">
    <link rel="stylesheet" href="../css/contact.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../js/header.js" defer></script>
    <script src="../js/contact.js" defer></script>
    <script src="../js/footer.js" defer></script>

    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card {
            display: block; 
            opacity: 1;
        }

        .product-card.animate-in {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .product-card.hidden {
            display: none !important;
        }

        .sidebar .category-btn {
            transition: all 0.2s ease-in-out;
        }

        /* กล่องแจ้งเตือนตอนโหลดข้อมูล */
        .loading-container {
            width: 100%;
            text-align: center;
            padding: 50px 20px;
            grid-column: 1 / -1;
            color: #666;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <my-header></my-header>
    
    <div class="container">
        <!-- Sidebar ด้านซ้าย -->
        <aside class="sidebar">
            <h3>เลือกจากความสนใจ</h3>
            <ul>
                <li><a href="#" class="category-btn active" data-category="all">ทั้งหมด</a></li>
                <li><a href="#" class="category-btn" data-category="eyes-ears">สายตาและการได้ยิน</a></li>
                <li><a href="#" class="category-btn" data-category="mens-health">สุขภาพผู้ชาย</a></li>
                <li><a href="#" class="category-btn" data-category="skin-aging">ผิวพรรณและชะลอวัย</a></li>
                <li><a href="#" class="category-btn" data-category="weight-metabolism">หุ่นและระบบเผาผลาญ</a></li>
                <li><a href="#" class="category-btn" data-category="gut-digestive">ลำไส้และการขับถ่าย</a></li>
                <li><a href="#" class="category-btn" data-category="bone-immunity">กระดูก ข้อ และภูมิคุ้มกัน</a></li>
                <li><a href="#" class="category-btn" data-category="blood-sugar">ระบบหัวใจและหลอดเลือด</a></li>
            </ul>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <!-- Header ของสินค้า -->
            <div class="shop-header">
                <span class="product-count">กำลังเตรียมข้อมูล...</span>
                <select>
                    <option value="">เรียงตาม: แนะนำ</option>
                    <option value="price-low">ราคา: ต่ำไปสูง</option>
                    <option value="price-high">ราคา: สูงไปต่ำ</option>
                </select>
            </div>

            <!-- Grid สินค้า (จะถูกเรนเดอร์ใหม่จาก JS เท่านั้น) -->
            <div class="products" id="products-container">
                <!-- ข้อมูลสินค้าจะถูกใส่ผ่าน JavaScript -->
            </div>
        </main>
    </div>

    <contact-section></contact-section>
    <my-footer></my-footer>

    <script>
    // 📌 บังคับล้าง Cache ของ Shop ทิ้ง เพื่อให้โหลดรูปล่าสุดจาก DB ทันที
    if (!localStorage.getItem('shop_cache_cleared_v13')) {
        localStorage.removeItem('siam_healthy_shop_products_cache');
        localStorage.setItem('shop_cache_cleared_v13', 'true');
    }

    document.addEventListener('DOMContentLoaded', () => {
        // 🔴 ตั้งค่า URL ให้ตรงกับ Backend และ Storage ของคุณ
        const API_URL = 'http://localhost:3000/products'; 
        const SUPABASE_BASE_URL = 'http://192.168.1.199:8000';
        
        const CACHE_KEY = 'siam_healthy_shop_products_cache';

        const categoryBtns = document.querySelectorAll('.category-btn');
        let productCards = [];
        const productsContainer = document.getElementById('products-container');
        const productCountText = document.querySelector('.product-count');
        const sortSelect = document.querySelector('.shop-header select');
        let isLogicInitialized = false;

        // ตารางแมปหมวดหมู่ตามชื่อสินค้า
        const categoryMap = {
            'andicellix': 'eyes-ears',
            'astin': 'blood-sugar',
            'backpro': 'mens-health',
            'blackrhino': 'mens-health',
            'carthisin': 'bone-immunity',
            'elsie': 'skin-aging',
            'extera': 'gut-digestive',
            'genesis': 'eyes-ears',
            'genesiscaps': 'eyes-ears',
            'geralox': 'gut-digestive',
            'helmina': 'gut-digestive',
            'oclarizin': 'eyes-ears',
            'onix': 'weight-metabolism',
            'philola': 'eyes-ears',
            'scomplex': 'skin-aging',
            'tchrome': 'weight-metabolism',
            'turbine': 'mens-health',
            'cartirex': 'bone-immunity'
        };

        // ฟังก์ชันปรับ URL รูปภาพให้มาจาก DB เสมอ
        function fixImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            if (url.startsWith('data:') || url.startsWith('blob:')) return url;
            let cleanUrl = url
                .replace(/https:\/\/qzgfjnjrnenncgxqbrqe\.supabase\.co/g, SUPABASE_BASE_URL)
                .replace(/\/product-images\//g, '/products/');
            if (cleanUrl.startsWith('/storage/v1/')) {
                cleanUrl = `${SUPABASE_BASE_URL}${cleanUrl}`;
            }
            return cleanUrl;
        }

        async function loadDataSafely() {
            // 1. ลองดึงข้อมูลจาก Cache มาแสดงทันที 0 วินาที
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    const parsedProducts = JSON.parse(cachedData);
                    renderProductsFromDB(parsedProducts);
                } catch (e) {
                    console.error("Cache reading error", e);
                }
            } else {
                productsContainer.innerHTML = '<div class="loading-container"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูลสินค้า...</div>';
            }

            // 2. ไปดึงข้อมูลล่าสุดจาก Backend แอบทำงานอยู่เบื้องหลัง
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(API_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const dbProducts = await response.json();
                    if (Array.isArray(dbProducts) && dbProducts.length > 0) {
                        
                        // 🟢 ย่อขนาดข้อมูลก่อนบันทึกลง Cache
                        const lightweightData = dbProducts.map(p => {
                            // พยายามแปลงรูปจาก JSON/Array ให้พร้อมใช้
                            let parsedImages = [];
                            if (typeof p.images === 'string') {
                                try { parsedImages = JSON.parse(p.images); } catch(e) { parsedImages = [p.images]; }
                            } else if (Array.isArray(p.images)) {
                                parsedImages = p.images;
                            }
                            
                            return {
                                id: p.id,
                                name: p.name,
                                isActive: p.isActive,
                                price: p.price,
                                oldPrice: p.oldPrice || p.old_price,
                                // เก็บเฉพาะรูปแรกเท่านั้นเพื่อความเบา
                                images: parsedImages.length > 0 ? [parsedImages[0]] : [] 
                            };
                        });

                        try {
                            localStorage.setItem(CACHE_KEY, JSON.stringify(lightweightData));
                        } catch (quotaError) {
                            console.warn("Storage เต็ม เคลียร์ของเก่าแล้วลองใหม่");
                            localStorage.clear(); 
                            localStorage.setItem(CACHE_KEY, JSON.stringify(lightweightData));
                        }

                        // อัปเดตหน้าจอด้วยข้อมูลเต็มแบบไร้รอยต่อ
                        renderProductsFromDB(lightweightData);
                    }
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (err) {
                console.warn('Backend ไม่ตอบสนอง จะใช้ข้อมูลใน Cache', err);
                if (!cachedData) {
                    productsContainer.innerHTML = '<div class="loading-container" style="color: red;">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้ กรุณาตรวจสอบว่า NestJS (Backend) เปิดทำงานอยู่หรือไม่</div>';
                    if(productCountText) productCountText.textContent = "0 ผลิตภัณฑ์";
                }
            }
        }

        // 🟢 เรนเดอร์การ์ดสินค้า โดยใช้แต่รูปจาก DB
        function renderProductsFromDB(dbProducts) {
            productsContainer.innerHTML = ''; // ล้างการ์ดเดิมออก

            dbProducts.forEach(dbProduct => {
                if (!dbProduct.name) return;

                // กรองสินค้าที่ปิดไว้ (Inactive) ออก
                if (dbProduct.isActive === false || String(dbProduct.isActive) === 'false') return;

                const rawSlug = dbProduct.name.toLowerCase().replace(/[\s\-_]/g, "");
                
                // ใช้ ID เป็นลิงก์เป้าหมาย
                const linkTarget = dbProduct.id || rawSlug; 
                
                const category = categoryMap[rawSlug] || 'all';
                
                // 🟢 ดึงรูปจาก DB 100% ถ้าไม่มีให้ใช้ Placeholder
                let imgSrc = "https://via.placeholder.com/300?text=No+Image";
                if (dbProduct.images && dbProduct.images.length > 0 && dbProduct.images[0]) {
                    imgSrc = fixImageUrl(dbProduct.images[0]);
                }

                const newPriceVal = dbProduct.price != null 
                    ? '฿' + Number(dbProduct.price).toLocaleString('en-US', {minimumFractionDigits: 0}) 
                    : '฿0';
                
                const oldPriceVal = dbProduct.oldPrice || dbProduct.old_price;
                let oldPriceHtml = '';
                if (oldPriceVal != null && oldPriceVal > 0) {
                    oldPriceHtml = `<span class="old-price">฿${Number(oldPriceVal).toLocaleString('en-US', {minimumFractionDigits: 0})}</span>`;
                }

                const card = document.createElement('div');
                card.className = 'product-card animate-in';
                card.setAttribute('data-category', category);
                
                // 🟢 แก้ไขตรงนี้: ลบ ../ ออก เพื่อให้หาไฟล์เจอ
                card.setAttribute('onclick', `window.location.href='product.html?id=${linkTarget}';`);
                
                card.dataset.price = dbProduct.price || 0;

                // ใส่ loading="lazy" ป้องกันโหลดรูปพร้อมกันทำให้กระตุก
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${imgSrc}" alt="${dbProduct.name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=No+Image';">
                    </div>
                    <h3 class="product-title">${dbProduct.name}</h3>
                    <p class="product-tag">#ผลิตภัณฑ์เสริมอาหาร</p>
                    <p class="product-price"><span class="new-price">${newPriceVal}</span> ${oldPriceHtml}</p>
                `;

                productsContainer.appendChild(card);
            });

            productCards = Array.from(document.querySelectorAll('.product-card'));
            initShopLogic();
        }

        function initShopLogic() {
            productCards.forEach((card, index) => {
                card.dataset.originalIndex = index;
                if (!card.dataset.price) {
                    const newPriceEl = card.querySelector('.new-price');
                    if (newPriceEl) {
                        const priceText = newPriceEl.textContent;
                        card.dataset.price = parseFloat(priceText.replace(/[^0.0-9.-]+/g, '')) || 0;
                    } else {
                        card.dataset.price = 0;
                    }
                }
            });

            // ทำแค่ครั้งเดียว ป้องกัน Event ซ้อนกันถ้าโหลดใหม่จาก Network
            if (!isLogicInitialized) {
                const urlParams = new URLSearchParams(window.location.search);
                const categoryParam = urlParams.get('category');
                if (categoryParam) {
                    const targetBtn = document.querySelector(`.category-btn[data-category="${categoryParam}"]`);
                    if (targetBtn) {
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        targetBtn.classList.add('active');
                    }
                }

                categoryBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        updateProductsUI();
                    });
                });

                if (sortSelect) {
                    sortSelect.addEventListener('change', updateProductsUI);
                }
                isLogicInitialized = true;
            }

            updateProductsUI();
        }

        function updateProductsUI() {
            try {
                const activeBtn = document.querySelector('.category-btn.active');
                const selectedCategory = activeBtn ? activeBtn.getAttribute('data-category') : 'all';
                const sortValue = sortSelect ? sortSelect.value : '';

                let sortedCards = [...productCards];

                if (sortValue === 'price-low') {
                    sortedCards.sort((a, b) => parseFloat(a.dataset.price) - parseFloat(b.dataset.price));
                } else if (sortValue === 'price-high') {
                    sortedCards.sort((a, b) => parseFloat(b.dataset.price) - parseFloat(a.dataset.price));
                } else {
                    sortedCards.sort((a, b) => parseInt(a.dataset.originalIndex) - parseInt(b.dataset.originalIndex));
                }

                let visibleIndex = 0;
                sortedCards.forEach(card => {
                    productsContainer.appendChild(card); 

                    const catAttr = card.getAttribute('data-category') || '';
                    const cardCategories = catAttr.split(' ');

                    card.classList.remove('animate-in', 'hidden');
                    card.style.animationDelay = '0s';

                    if (selectedCategory === 'all' || cardCategories.includes(selectedCategory)) {
                        card.style.animationDelay = `${visibleIndex * 0.05}s`;
                        void card.offsetWidth; 
                        card.style.display = 'block'; 
                        card.classList.add('animate-in'); 
                        visibleIndex++;
                    } else {
                        card.style.display = 'none'; 
                        card.classList.add('hidden');
                    }
                });

                if (productCountText) {
                    productCountText.textContent = `${visibleIndex} ผลิตภัณฑ์`;
                }
            } catch (e) {
                console.error('Error in UI rendering:', e);
            }
        }

        loadDataSafely();
    });
    </script>
</body>
</html>
