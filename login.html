<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / สมัครสมาชิก | Siam-Healthy</title>

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- เพิ่ม SweetAlert2 สำหรับแจ้งเตือน Error/Success แบบสวยงาม -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./js/header.js" defer></script>
    <script src="./js/contact.js"></script>
    <script src="./js/footer.js" defer></script>
</head>

<body>
    <!-- Header Web Component -->
    <my-header></my-header>

    <main class="auth-main">
        <div class="auth-container">
            <!-- Navigation Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">เข้าสู่ระบบ</button>
                <button class="tab-btn" data-tab="register">สร้างบัญชีใหม่</button>
            </div>

            <!-- Form Panels Wrapper -->
            <div class="auth-body">
                
                <!-- Login Form -->
                <form id="loginForm" class="auth-panel active" novalidate>
                    <div class="panel-header">
                        <h2>ยินดีต้อนรับกลับมา</h2>
                        <p>เข้าสู่ระบบเพื่อจัดการคำสั่งซื้อและรับสิทธิประโยชน์</p>
                    </div>

                    <!-- Email or Username Field -->
                    <div class="form-group">
                        <label for="loginIdentifier">อีเมล หรือ Username</label>
                        <div class="input-wrapper">
                            <input type="text" id="loginIdentifier" placeholder="กรอกอีเมล หรือ Username" required>
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <div class="label-row">
                            <label for="loginPassword">รหัสผ่าน</label>
                            <a href="forgot-password.html" class="forgot-pass">ลืมรหัสผ่าน?</a>
                        </div>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่านของคุณ" required>
                            <button type="button" class="toggle-password" aria-label="Toggle Password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>จดจำการเข้าสู่ระบบ</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>

                    <!-- Divider -->
                    <!-- <div class="auth-divider">
                        <span>หรือเข้าสู่ระบบด้วยช่องทางอื่น</span>
                    </div> -->

                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>เข้าสู่ระบบด้วย Google</span>
                        </button>
                    </div> -->
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-panel" novalidate>
                    <div class="panel-header">
                        <h2>สร้างบัญชีใหม่</h2>
                        <p>สร้างบัญชีใหม่เพื่อจัดการคำสั่งซื้อและรับสิทธิประโยชน์</p>
                    </div>

                    <div class="form-group">
                        <label for="regUsername">ชื่อผู้ใช้งาน (Username)</label>
                        <div class="input-wrapper">
                            <input type="text" id="regUsername" placeholder="ตั้งชื่อผู้ใช้งาน" required>
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">อีเมล</label>
                        <div class="input-wrapper">
                            <input type="email" id="regEmail" placeholder="example@domain.com" required>
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPhone">เบอร์โทรศัพท์</label>
                        <div class="input-wrapper">
                            <input type="tel" id="regPhone" placeholder="08X-XXX-XXXX" maxlength="10" required>
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">รหัสผ่าน</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="regPassword" placeholder="อย่างน้อย 8 ตัวอักษร" minlength="8" required>
                            <button type="button" class="toggle-password" aria-label="Toggle Password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="acceptTerms" required>
                            <span>ฉันยอมรับ <a href="/terms" target="_blank">เงื่อนไขการใช้งาน</a> และ <a href="/privacy" target="_blank">นโยบายความเป็นส่วนตัว</a></span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">สมัครสมาชิก</button>

                    <!-- Divider -->
                    <!-- <div class="auth-divider">
                        <span>หรือสมัครสมาชิกด้วยช่องทางอื่น</span>
                    </div> -->

                    <!-- <div class="social-login-group">

                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>

                            </svg>
                            <span>สมัครด้วยบัญชี Google</span>
                        </button>
                    </div> -->
                </form>

            </div>
        </div>
    </main>

    <contact-section></contact-section>
    <my-footer></my-footer>

    <!-- ฝังโค้ด JS จัดการเชื่อมต่อ Backend -->
    <script src="./js/auth.js"></script>
</body>

</html>
