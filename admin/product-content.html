<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการรีวิวและสารสกัด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; }
        .tab-btn.active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10 sticky top-0">
            <h2 class="text-xl font-semibold text-gray-800">จัดการข้อมูลสินค้า (รีวิว & สารสกัด)</h2>
        </header>

        <div class="p-6 w-full space-y-6 flex-1 max-w-7xl mx-auto">
            
            <!-- 1. เลือกสินค้า -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center gap-4">
                <label class="font-medium text-gray-700 whitespace-nowrap">เลือกสินค้าที่ต้องการจัดการ:</label>
                <select id="productSelect" onchange="loadProductDetails()" class="w-full md:w-1/2 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">-- กำลังโหลดรายการสินค้า --</option>
                </select>
            </div>

            <!-- 2. พื้นที่จัดการ (จะซ่อนไว้จนกว่าจะเลือกสินค้า) -->
            <div id="contentWorkspace" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                
                <!-- Tabs -->
                <div class="flex border-b border-gray-200">
                    <button onclick="switchTab('ingredients')" id="tab-ingredients" class="tab-btn active px-6 py-4 text-gray-500 hover:text-indigo-600 focus:outline-none transition-colors">
                        <i class="fas fa-leaf mr-2"></i> สารสกัดในสินค้า (Ingredients)
                    </button>
                    <button onclick="switchTab('reviews')" id="tab-reviews" class="tab-btn px-6 py-4 text-gray-500 hover:text-indigo-600 focus:outline-none transition-colors">
                        <i class="fas fa-star mr-2"></i> รีวิวจากผู้ใช้จริง (Reviews)
                    </button>
                </div>

                <div class="p-6">
                    <!-- Tab Content: Ingredients -->
                    <div id="content-ingredients">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-semibold text-gray-800">รายการสารสกัด</h3>
                            <button onclick="openIngredientModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-plus mr-1"></i> เพิ่มสารสกัด</button>
                        </div>
                        <div id="ingredientsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Render จาก JS -->
                        </div>
                    </div>

                    <!-- Tab Content: Reviews -->
                    <div id="content-reviews" class="hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-semibold text-gray-800">รายการรีวิว</h3>
                            <button onclick="openReviewModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-plus mr-1"></i> เพิ่มรีวิว</button>
                        </div>
                        <div id="reviewsList" class="space-y-4">
                            <!-- Render จาก JS -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="./js/sidebar.js"></script>
    <script src="./js/product-content.js"></script>
</body>
</html>
