<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแลระบบ - Admin System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Prompt', sans-serif;
        }

        /* สำหรับ Chrome, Safari, Edge, Opera และเบราว์เซอร์ที่ใช้ WebKit */
        input::-webkit-reveal,
        input::-webkit-clear-button {
            display: none;
        }

        /* สำหรับ Firefox และมาตรฐาน CSS */
        input {
            -webkit-appearance: textfield;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        
        input[type="password"]::-ms-reveal {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="max-w-md w-full">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-200 mb-4">
                <i class="fas fa-user-shield text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Admin Management System</h1>
            <p class="text-sm text-gray-500 mt-1">ยินดีต้อนรับ กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูล</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-gray-100 border border-gray-100 p-8">
            <form id="loginForm" class="space-y-6">
                
                <!-- Alert Error Message -->
                <div id="errorAlert" class="hidden p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg text-sm text-red-700 flex items-center justify-between transition-all">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-circle text-red-500 mr-2 text-lg"></i>
                        <span id="errorMessage">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
                    </div>
                    <button type="button" onclick="hideError()" class="text-red-400 hover:text-red-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Input: Email/Username -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        อีเมลผู้ใช้งาน หรือ ชื่อผู้ใช้
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="text" id="email" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-gray-800 transition outline-none"
                            placeholder="admin@example.com">
                    </div>
                </div>

                <!-- Input: Password -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            รหัสผ่าน
                        </label>
                        <a href="forgot-password.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">
                            ลืมรหัสผ่าน?
                        </a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" required
                            class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-gray-800 transition outline-none"
                            placeholder="••••••••">
                        <button type="button" id="toggleVisibilityBtn" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 transition">
                            <i id="toggleIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center">
                    <input id="remember" type="checkbox"
                        class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 focus:ring-2 cursor-pointer">
                    <label for="remember" class="ml-2.5 text-sm text-gray-600 cursor-pointer select-none">
                        จดจำการเข้าสู่ระบบ
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-100 transition duration-200 flex justify-center items-center group active:scale-[0.99]">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fas fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform" id="btnIcon"></i>
                </button>

            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            &copy; 2026 Admin Dashboard. All rights reserved.
        </p>
    </div>

    <!-- 🟢 ลิงก์ไฟล์ JavaScript แยก -->
    <script src="./js/login.js"></script>
</body>
</html>
