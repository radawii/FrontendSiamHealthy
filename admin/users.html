<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - จัดการข้อมูลผู้ใช้งาน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { 
            font-family: 'Prompt', sans-serif; 
            opacity: 0; /* ซ่อนหน้าไว้ก่อนสำหรับทำ Fade-in */
            transition: opacity 0.3s ease-in-out;
        }
        /* Custom Scrollbar สำหรับตาราง */
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- 🟢 Container สำหรับแสดง Sidebar จาก sidebar.js -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <!-- Top Navbar -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10 sticky top-0 border-b border-gray-100">
            <div class="flex items-center">
                <button class="sm:hidden text-gray-600 focus:outline-none mr-4">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h2 class="text-xl font-semibold text-gray-800">จัดการข้อมูลผู้ใช้งาน</h2>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 border-l pl-4 border-gray-200">
                    <span class="text-sm text-gray-600 hidden md:inline">ผู้ดูแลระบบ (Admin)</span>
                    <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                        AD
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area (ปรับให้ขยายเต็มหน้าจอแล้ว) -->
        <div class="p-6 w-full space-y-6 flex-1">

            <!-- Search & Action Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <!-- Search Box -->
                <div class="relative w-full md:max-w-lg">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" onkeyup="searchUsers()" placeholder="ค้นหารหัสผู้ใช้งาน, ชื่อ-นามสกุล, อีเมล, เบอร์โทร..." 
                        class="w-full pl-11 pr-4 py-2.5 bg-gray-50 border border-transparent rounded-lg focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none transition-all text-sm">
                </div>
                
                <!-- Add Button -->
                <div class="flex w-full md:w-auto">
                    <button onclick="openAddUserModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                        <i class="fas fa-user-plus"></i> เพิ่มผู้ใช้งานใหม่
                    </button>
                </div>
            </div>

            <!-- Users Table Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 bg-white">
                    <h3 class="font-semibold text-gray-800 flex items-center">
                        รายการผู้ใช้งานทั้งหมด 
                        <span id="total-users-header" class="ml-2 px-2.5 py-0.5 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold">0 รายการ</span>
                    </h3>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[1000px]">
                        <thead>
                            <tr class="bg-white border-b border-gray-200 text-gray-400 text-xs font-medium tracking-wide uppercase">
                                <th class="p-5 w-32">รหัสผู้ใช้งาน <span class="font-normal text-[10px]">(user_id)</span></th>
                                <th class="p-5 w-64">ชื่อ-นามสกุล <span class="font-normal text-[10px]">(username)</span></th>
                                <th class="p-5">อีเมล (LOGIN) <span class="font-normal text-[10px]">(email)</span></th>
                                <th class="p-5 w-40">เบอร์โทรศัพท์ <span class="font-normal text-[10px]">(phone_number)</span></th>
                                <th class="p-5 w-36">สิทธิ์การใช้งาน <span class="font-normal text-[10px]">(role)</span></th>
                                <th class="p-5 text-center w-28">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="text-sm text-gray-700 divide-y divide-gray-50">
                            <!-- Loading State -->
                            <tr>
                                <td colspan="6" class="p-12 text-center text-gray-400">
                                    <i class="fas fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
                                    <p class="font-medium text-gray-500">กำลังโหลดข้อมูลผู้ใช้งาน...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="p-5 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500 bg-white" id="paginationInfo">
                    <span>กำลังประมวลผลข้อมูล...</span>
                </div>
            </div>

        </div>
    </main>

    <!-- 🟢 Script พื้นฐาน -->
    <script src="./js/sidebar.js"></script>
    <script src="./js/users.js"></script>
    
    <script>
        // --- Fade-in Transition ป้องกันหน้าจอกระตุก ---
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 50);
        });

        // ทำให้ตอนกดลิงก์ เฟดออกให้เนียนๆ ก่อนเปลี่ยนหน้า
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.hostname === window.location.hostname && this.target !== '_blank' && !this.hasAttribute('onclick')) {
                    e.preventDefault();
                    const target = this.href;
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = target; }, 200);
                }
            });
        });
    </script>
    <script src="./js/notifications.js"></script>
</body>
</html>
