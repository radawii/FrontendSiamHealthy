<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำสั่งซื้อ | Siam-Healthy</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="./css/order-detail.css">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="../js/header.js" defer></script>
    <script src="../js/contact.js" defer></script>
    <script src="../js/footer.js" defer></script>
</head>
<body>

    <!-- Header Component -->
    <my-header></my-header>

    <main class="main-content">
        <div class="order-detail-card">
            <div class="order-detail-header">
                <h2><i class="fa-solid fa-box-open"></i> รายละเอียดคำสั่งซื้อ</h2>
                <a href="./orders.html" class="back-to-orders-btn"><i class="fa-solid fa-arrow-left"></i> ประวัติคำสั่งซื้อ</a>
            </div>

            <div id="orderDetailsContainer">
                <!-- ข้อมูลจะถูกเรนเดอร์ด้วย JavaScript ด้านล่าง -->
            </div>
        </div>
    </main>

    <!-- Contact & Footer -->
    <contact-section></contact-section>
    <my-footer></my-footer>
    
    <script>
        // ฟังก์ชันแปลงเลขออเดอร์ให้ตรงกันกับ Admin
        function formatOrderId(id) {
            if (!id) return '-';
            if (id.toString().startsWith('ORD')) return id;
            const cleanId = id.toString().replace('SH-', '');
            if (cleanId.length <= 6) {
                return `ORD2026${cleanId.padStart(6, '0')}`;
            }
            return `ORD${cleanId}`;
        }

        // ฟังก์ชันช่วยจัดรูปแบบที่อยู่จัดส่งให้เป็นข้อความอ่านง่าย
        function buildFullAddress(addr) {
            if (!addr) return 'ไม่พบข้อมูลที่อยู่';
            if (typeof addr === 'string') return addr; 

            let parts = [];
            if(addr.houseNo) parts.push(`เลขที่ ${addr.houseNo}`);
            if(addr.moo) parts.push(`หมู่ที่ ${addr.moo}`);
            if(addr.village) parts.push(`หมู่บ้าน ${addr.village}`);
            if(addr.soi) parts.push(`ซอย ${addr.soi}`);
            if(addr.road) parts.push(`ถนน ${addr.road}`);
            if(addr.subdistrict) parts.push(`ต.${addr.subdistrict}`);
            if(addr.district) parts.push(`อ.${addr.district}`);
            if(addr.province) parts.push(`จ.${addr.province}`);
            if(addr.zipcode) parts.push(`${addr.zipcode}`);
            return parts.join(' ');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('orderDetailsContainer');

            const urlParams = new URLSearchParams(window.location.search);
            const targetOrderId = urlParams.get('id');

            let order = null;

            const storedOrders = JSON.parse(localStorage.getItem('siam_healthy_orders')) || [];
            if (targetOrderId) {
                order = storedOrders.find(o => String(o.orderId) === String(targetOrderId));
            }

            if (!order) {
                const latestOrderJSON = localStorage.getItem('latest_order');
                if (latestOrderJSON) {
                    const parsedLatest = JSON.parse(latestOrderJSON);
                    if (!targetOrderId || String(parsedLatest.orderId) === String(targetOrderId)) {
                        order = parsedLatest;
                    }
                }
            }

            if (!order) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: var(--text-muted); margin-bottom: 15px;">ไม่พบข้อมูลคำสั่งซื้อที่คุณต้องการ</p>
                        <a href="./orders.html" class="btn-primary-custom">กลับไปหน้าประวัติคำสั่งซื้อ</a>
                    </div>
                `;
                return;
            }

            let itemsHTML = (order.items || []).map(item => {
                const itemName = item.name || item.product_name || 'สินค้า';
                const itemImage = item.image || '../images/default-product.png';
                const itemQty = item.quantity || 1;
                const itemPrice = item.price || 0;

                return `
                    <div class="order-item-row">
                        <img src="${itemImage}" alt="${itemName}" onerror="this.src='../images/default-product.png'">
                        <div class="order-item-info">
                            <h4>${itemName}</h4>
                            <p>จำนวน: ${itemQty} ชิ้น</p>
                        </div>
                        <span class="order-item-price">฿${(itemPrice * itemQty).toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                    </div>
                `;
            }).join('');

            let paymentStr = order.paymentMethod;
            if (paymentStr === 'promptpay') paymentStr = 'สแกน QR Code / พร้อมเพย์';
            else if (paymentStr === 'credit' || paymentStr === 'card' || paymentStr === 'stripe') paymentStr = 'บัตรเครดิต / เดบิต';
            else if (paymentStr === 'cod') paymentStr = 'เก็บเงินปลายทาง (COD)';

            const addressObj = order.shippingAddress;
            const fullAddressText = buildFullAddress(addressObj);
            const receiverName = addressObj?.fullname || 'คุณลูกค้า';
            const receiverPhone = addressObj?.phone ? `(${addressObj.phone})` : '';

            // แปลงหมายเลขคำสั่งซื้อให้เป็นรูปแบบเต็ม
            const fullOrderId = formatOrderId(order.orderId);

            container.innerHTML = `
                <div class="order-meta-box">
                    <p><strong>หมายเลขคำสั่งซื้อ:</strong> ${fullOrderId}</p>
                    <p><strong>วันที่สั่งซื้อ:</strong> ${order.date || '-'}</p>
                    <p><strong>สถานะคำสั่งซื้อ:</strong> <span class="status-success">ชำระเงินเรียบร้อยแล้ว</span></p>
                    <p><strong>ช่องทางชำระเงิน:</strong> ${paymentStr}</p>
                </div>

                <h3 class="section-title">รายการสินค้าที่สั่งซื้อ</h3>
                <div class="order-items-container">${itemsHTML}</div>

                <div class="order-address-box">
                    <h3 class="section-title" style="margin-bottom: 8px;">ที่อยู่จัดส่ง</h3>
                    <p class="receiver-name">${receiverName} ${receiverPhone}</p>
                    <p class="receiver-address">${fullAddressText}</p>
                </div>

                <div class="order-total-section" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
    
                <!-- ยอดรวมก่อนหักส่วนลด -->
                <div style="display: flex; justify-content: space-between; width: 100%; max-width: 320px;">
                    <span style="color: var(--text-muted); font-size: 0.95rem;">ยอดรวมสินค้า:</span>
                    <span style="font-size: 0.95rem;">฿${(order.subtotal || order.grandTotal).toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                </div>

                <!-- แสดงส่วนลด (ถ้ามี) -->
                ${(order.discount && order.discount > 0) ? `
                <div style="display: flex; justify-content: space-between; width: 100%; max-width: 320px; color: #e11d48;">
                    <span style="font-size: 0.95rem;">ส่วนลดคูปอง:</span>
                    <span style="font-weight: 600; font-size: 0.95rem;">-฿${order.discount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                </div>
                ` : ''}

                <!-- ยอดชำระสุทธิ -->
                <div style="display: flex; justify-content: space-between; width: 100%; max-width: 320px; font-size: 1.15rem; font-weight: 700; color: #0d5c2e; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1;">
                    <span>ยอดชำระสุทธิ:</span>
                    <span>฿${(order.grandTotal || 0).toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                </div>

            </div>
            `;
        });
    </script>
</body>
</html>
